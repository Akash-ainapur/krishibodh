<!DOCTYPE html>
<html>
<head>
  <title>KrishiBodh Control Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>KrishiBodh Control Panel</h2>
  <div class="button-container plant-buttons">
    <button id="plant1" onclick="sendCoords(800,800,1000)">🌱 Plant 1</button>
    <button id="plant2" onclick="sendCoords(2400,1200,1000)">🌱 Plant 2</button>
  </div>
  <div class="button-container control-buttons">
    <button id="home" onclick="sendCoords(0, 0, 0)">🏠 Home</button>
    <button id="connect" onclick="connectToArduino()">🔌 Connect</button>
  </div>
  <div class="ai-command">
    <input type="text" id="userCommand" placeholder="Type a command for Bodhish...">
    <button onclick="sendAICommand()">🤖 Send to AI</button>
  </div>
  <div id="status-area">Waiting for connection...</div>
  <script>
    let port, writer, reader;
    const statusArea = document.getElementById('status-area');
    function updateStatus(message) {
      console.log("Status Update:", message);
      statusArea.textContent = message;
    }
    async function connectToArduino() {
      updateStatus("Attempting connection...");
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        const encoder = new TextEncoderStream();
        encoder.readable.pipeTo(port.writable);
        writer = encoder.writable.getWriter();
        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        reader = decoder.readable.getReader();
        updateStatus("Connected! Waiting for Arduino initialization...");
        readLoop();
      } catch (err) {
        updateStatus("Connection Error: " + err.message);
        console.error(err);
      }
    }
    async function readLoop() {
      try {
        let lineBuffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            reader.releaseLock();
            updateStatus("Arduino disconnected.");
            break;
          }
          if (value) {
            lineBuffer += value;
            let lines = lineBuffer.split('\n');
            lineBuffer = lines.pop();
            lines.forEach(line => {
              line = line.trim();
              if (line.startsWith("STATUS:")) {
                updateStatus(line.substring(7).trim());
              } else if (line) {
                console.log("Received (ignored):", line);
              }
            });
          }
        }
      } catch (error) {
        updateStatus("Read Error: " + error.message);
        console.error(error);
      }
    }
    async function sendCoords(x, y, z) {
      if (!writer) {
        updateStatus("Error: Not connected. Please connect first.");
        return;
      }
      try {
        updateStatus(`Sending X: ${x}...`);
        await writer.write(`${x}\n`);
        updateStatus(`Sending Y: ${y}...`);
        await writer.write(`${y}\n`);
        updateStatus(`Sending Z: ${z}...`);
        await writer.write(`${z}\n`);
        updateStatus(`Coordinates (${x}, ${y}, ${z}) sent. Waiting for Arduino...`);
        console.log("Sent:", x, y, z);
      } catch (error) {
        updateStatus("Send Error: " + error.message);
        console.error("Send Error:", error);
      }
    }
    async function sendAICommand() {
      const command = document.getElementById("userCommand").value.trim();
      if (!command) {
        updateStatus("Please enter a command.");
        return;
      }
      updateStatus("Processing AI command...");
      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({prompt: command})
        });
        if (!response.ok) {
          updateStatus("Server error: " + response.status);
          console.error(await response.text());
          return;
        }
        const data = await response.json();
        if (data && data.action==="sendCoords" && data.x!==undefined) {
          sendCoords(data.x, data.y, data.z);
        } else {
          updateStatus("Invalid response from AI.");
          console.log("AI Response:", data);
        }
      } catch (error) {
        updateStatus("AI Error: " + error.message);
        console.error("AI Fetch Error:", error);
      }
    }
    window.addEventListener('beforeunload', async () => {
      if (reader) await reader.cancel();
      if (writer) writer.releaseLock();
      if (port) await port.close();
    });
  </script>
</body>
</html>
